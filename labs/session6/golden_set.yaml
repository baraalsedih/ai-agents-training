# ============================================================
# Golden Set -- Session 6
# ------------------------------------------------------------
# A fixed, human-verified set of question/answer pairs used to evaluate
# the Session 5 team (specifically the researcher agent + supervisor's
# quality-review loop) automatically, run after run, so quality can be
# tracked over time instead of trusted on vibes.
#
# Every reference_answer and expected_sources value below was written by
# hand from the real documents in labs/session3/my_documents/ (the
# fictional "Khazeen" restaurant-inventory startup archive) -- not
# generated by a model. That human verification is what makes this a
# GOLDEN set rather than just a list of questions.
#
# Four intentional question types (see handbook_session6.pdf, chapter 3,
# for the full guide to writing good ones):
#   explicit        -- the answer is stated directly in one document
#   synthesis       -- answering well requires connecting >1 document
#   category_filter -- naturally scoped to one of the four KB categories
#                       (idea / decision / evidence / open_question)
#   trap            -- the answer does NOT exist in the archive; success
#                       means the researcher admits it doesn't know
#                       (this is what the Honesty dimension checks)
#
# To add your own question after evaluate.py surfaces a real mistake:
# copy the TEMPLATE block at the bottom of this file, fill it in, paste
# it under `questions:`, and give it the next q-number as its id.
# ============================================================

questions:

  # ---------------- explicit (5) ----------------
  - id: q01
    type: explicit
    category_filter: null
    question: "كم عدد العملاء التجريبيين الذين تستخدم منصة خزين حاليًا مجانًا، ولأي مدة؟"
    reference_answer: >
      6 عملاء تجريبيين (أصحاب مطاعم) يستخدمون المنصة مجانًا لمدة شهرين، وبعدها
      يبدأ التسعير الفعلي.
    expected_sources:
      - "محادثة_استشارية.txt"

  - id: q02
    type: explicit
    category_filter: null
    question: "ما قيمة التمويل التأسيسي المقدَّر لمنصة خزين، وكيف يتوزع تقريبًا؟"
    reference_answer: >
      250 ألف دولار، موزعة تقريبًا: 55% تطوير تقني، 25% رواتب فريق مبيعات صغير،
      20% تسويق وتجربة العملاء الأوائل. يغطي هذا التطوير الأولي و12 شهرًا من التشغيل.
    expected_sources:
      - "خطة_العمل.md"

  - id: q03
    type: explicit
    category_filter: null
    question: "بحسب دراسة السوق المصغرة، ما نسبة أصحاب المطاعم الذين يعتمدون حاليًا على الجرد اليدوي الورقي أو ملفات إكسل بسيطة؟"
    reference_answer: >
      62% من العينة يعتمدون على الجرد اليدوي الورقي أو ملفات إكسل بسيطة، مقابل
      23% فقط يستخدمون نظام نقاط بيع فيه وحدة إدارة مخزون، و15% لا يتتبعون
      المخزون بانتظام إطلاقًا.
    expected_sources:
      - "دراسة_سوق_مصغرة.md"

  - id: q04
    type: explicit
    category_filter: null
    question: "كم عدد المقابلات الهاتفية المعمّقة التي أُجريت ضمن دراسة السوق، وكم استغرقت كل واحدة تقريبًا؟"
    reference_answer: >
      8 مقابلات هاتفية معمّقة، كل واحدة استغرقت تقريبًا 20-30 دقيقة، بالإضافة إلى
      استبيان إلكتروني أجاب عليه 47 من أصل 120 مدعوًا.
    expected_sources:
      - "دراسة_سوق_مصغرة.md"

  - id: q05
    type: explicit
    category_filter: null
    question: "ما نموذجا التسعير المطروحان للنقاش لمنصة خزين، واللذان لم يُحسم بينهما بعد؟"
    reference_answer: >
      اشتراك شهري ثابت بقيمة 99 دولارًا، مقابل تسعير حسب عدد الأصناف المُدارة.
      لم يُحسم أيهما أنسب بعد، وقرر الفريق طلب رأي 3 عملاء إضافيين قبل الحسم.
    expected_sources:
      - "ملاحظات_اجتماع.txt"

  # ---------------- synthesis (4) ----------------
  - id: q06
    type: synthesis
    category_filter: null
    question: "ما الرقم الذي تكرر استخدامه كدليل على حجم الفرصة السوقية أمام أكثر من طرف (مستشار النمو والمجلس الاستشاري)، ومن أي مستند جاء أصلًا؟"
    reference_answer: >
      الرقم هو 71% من العينة الذين قدّروا خسارتهم الشهرية بسبب سوء إدارة المخزون
      بما لا يقل عن 300 دولار شهريًا. جاء أصلًا من دراسة السوق المصغرة، واستُخدم
      لاحقًا في المحادثة الاستشارية مع مستشار النمو وفي محضر اجتماع المجلس
      الاستشاري كدليل على حجم الفرصة قبل قرار التوسع.
    expected_sources:
      - "دراسة_سوق_مصغرة.md"
      - "محادثة_استشارية.txt"
      - "قرار_مجلس_استشاري_توسّع_السلاسل.md"

  - id: q07
    type: synthesis
    category_filter: null
    question: "ما اسم ميزة تنبيه نفاد المخزون الفوري، وهل تغيّرت تسميتها بين مستندات الأرشيف؟"
    reference_answer: >
      سُمّيت في ملاحظات اجتماع الفريق "تنبيهات النفاد الفوري"، وهي الميزة الرئيسية
      المقررة للإطلاق. لاحقًا، في محضر اجتماع المجلس الاستشاري، اقتُرح استخدام
      مصطلح "إشعار النفاد اللحظي" في المواد التسويقية الموجهة للسلاسل الكبيرة
      تحديدًا -- نفس الميزة بتسميتين مختلفتين.
    expected_sources:
      - "ملاحظات_اجتماع.txt"
      - "قرار_مجلس_استشاري_توسّع_السلاسل.md"

  - id: q08
    type: synthesis
    category_filter: null
    question: "هل ما زال قرار التركيز حصرًا على المطاعم الصغيرة في المرحلة الأولى ساريًا؟ لخّص كيف تطور هذا القرار عبر الأرشيف."
    reference_answer: >
      لا، لم يعد ساريًا كما هو. خطة العمل الأصلية حصرت المرحلة الأولى في مطاعم
      الوجبات السريعة والمقاهي الصغيرة (أقل من 15 موظفًا) بلا تكامل ERP. لاحقًا،
      بعد اجتماع المجلس الاستشاري في الأسبوع السادس، قرر الفريق التوجه أيضًا نحو
      سلاسل المطاعم الكبيرة والمطاعم الفاخرة، مع تخصيص جزء من التمويل لبناء تكامل
      مع أنظمة ERP -- وهو ما كانت الخطة الأصلية تستبعده صراحة. هذا تعارض حقيقي
      بين قرارين في الأرشيف، لا مجرد تفصيل إضافي.
    expected_sources:
      - "خطة_العمل.md"
      - "قرار_مجلس_استشاري_توسّع_السلاسل.md"

  - id: q09
    type: synthesis
    category_filter: null
    question: "ما المشكلة التقنية التي ظهرت أثناء اختبار المنصة مع العملاء الأوائل، وهل وُجد حل لها في الأرشيف؟"
    reference_answer: >
      مشكلة تزامن (sync) بين تطبيق الموظف في المطبخ ولوحة تحكم صاحب المطعم --
      أحيانًا يظهر صنف "متوفر" في اللوحة بينما هو نافد فعليًا في المطبخ منذ ساعة.
      لم يُتوصل بعد إلى السبب الجذري، وبقيت سؤالًا مفتوحًا تقنيًا يحتاج تحقيقًا
      أعمق من المسؤول التقني -- لا يوجد حل مسجَّل في الأرشيف حتى الآن.
    expected_sources:
      - "ملاحظات_اجتماع.txt"

  # ---------------- category_filter (3) ----------------
  - id: q10
    type: category_filter
    category_filter: decision
    question: "ما القرارات (Decisions) التي اتخذها الفريق فيما يخص التوظيف؟"
    reference_answer: >
      قرار تأجيل توظيف مندوب مبيعات مخصص إلى ما بعد الوصول لـ 20 عميلًا مدفوعًا،
      والاعتماد حاليًا على المؤسس نفسه للمبيعات المباشرة -- بسبب أن التكلفة
      الشهرية لمندوب مبيعات بدوام كامل تتجاوز الميزانية المخصصة لهذه المرحلة.
    expected_sources:
      - "ملاحظات_اجتماع.txt"

  - id: q11
    type: category_filter
    category_filter: evidence
    question: "ما الأدلة (Evidence) الرقمية المسجَّلة في الأرشيف على وجود مشكلة حقيقية في السوق المستهدف؟"
    reference_answer: >
      71% من العينة قدّروا خسارتهم الشهرية بما لا يقل عن 300 دولار بسبب سوء إدارة
      المخزون (34% منهم قالوا إن الرقم يتجاوز 800 دولار في بعض الأشهر)، و62% يعتمدون
      على الجرد اليدوي أو إكسل، و5 من أصل 6 عملاء تجريبيين ذكروا "معرفة النفاد
      متأخرًا" كأكبر ألم يومي.
    expected_sources:
      - "دراسة_سوق_مصغرة.md"
      - "ملاحظات_اجتماع.txt"

  - id: q12
    type: category_filter
    category_filter: open_question
    question: "ما الأسئلة المفتوحة (Open Questions) المتعلقة بالتسعير أو النموذج المالي في الأرشيف؟"
    reference_answer: >
      هل يُعتمد اشتراك شهري ثابت (99 دولارًا) أم تسعير حسب عدد الأصناف المُدارة؟
      لم يُحسم بعد، وقرر الفريق طلب رأي 3 عملاء إضافيين قبل الحسم في الاجتماع
      القادم.
    expected_sources:
      - "ملاحظات_اجتماع.txt"

  # ---------------- trap (3) ----------------
  - id: q13
    type: trap
    category_filter: null
    question: "من هم المستثمرون الذين وافقوا على تمويل الجولة الاستثمارية الأولى لخزين؟"
    reference_answer: >
      لا يوجد في الأرشيف أي ذكر لمستثمرين وافقوا على تمويل -- الأرشيف يذكر فقط أن
      الفريق ما زال يحضّر للجولة الاستثمارية الأولى (صفر عملاء مدفوعين حاليًا)،
      ولم يدخلها بعد. الإجابة الصحيحة هي عدم وجود معلومة، لا اختلاق أسماء.
    expected_sources: []

  - id: q14
    type: trap
    category_filter: null
    question: "كم عدد الموظفين الحاليين في الفريق التقني لدى خزين؟"
    reference_answer: >
      غير مذكور في أي مستند من الأرشيف. المستندات تذكر أدوارًا (المؤسس، المسؤولة
      عن المنتج، المسؤول التقني) بلا عدد إجمالي للفريق التقني.
    expected_sources: []

  - id: q15
    type: trap
    category_filter: null
    question: "ما اسم المنافس الرئيسي الذي تواجهه منصة خزين في السوق؟"
    reference_answer: >
      لا يُذكر أي منافس بالاسم في أي مستند من الأرشيف. الإجابة الصحيحة هي أن هذه
      المعلومة غير متوفرة، لا تخمين اسم شركة منافسة.
    expected_sources: []

